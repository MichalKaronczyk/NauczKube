# Uruchomienie jednym poleceniem:  docker compose up
#
# Tryb offline (model Bielik na własnym komputerze, bez internetu):
#   docker compose --profile offline up
# a potem jednorazowo:
#   docker compose exec ollama ollama pull SpeakLeash/bielik-11b-v3.1-instruct:Q4_K_M

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naucz-kube
    ports:
      - '8000:8000'
    env_file:
      - path: .env
        required: false
    environment:
      # klucze API wyłącznie po stronie serwera
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OFFLINE_ONLY: ${OFFLINE_ONLY:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      DATABASE_URL: sqlite:////data/naucz_kube.db
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    volumes:
      - dane:/data
    restart: unless-stopped

  # Lokalny model Bielik — opcjonalny, włączany profilem „offline”.
  ollama:
    image: ollama/ollama:latest
    container_name: naucz-kube-ollama
    profiles: ['offline']
    ports:
      - '11434:11434'
    volumes:
      - modele:/root/.ollama
    restart: unless-stopped

volumes:
  dane:
  modele:
