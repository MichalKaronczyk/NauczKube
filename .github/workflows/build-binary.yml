name: Wersja binarna

# Buduje plik wykonywalny wymagany przez regulamin — osobno dla Windows, macOS
# i Linuksa. PyInstaller NIE potrafi kompilować skrośnie, więc `.exe` dla jury
# musi powstać na maszynie z Windows; to robi właśnie ten workflow.
#
# Uruchomienie ręczne: zakładka Actions → „Wersja binarna” → Run workflow.
# Gotowe pliki są w artefaktach danego przebiegu (sekcja Artifacts).
# Dodatkowo: push tagu `v*` dokleja binarki do Release'u.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (.exe)
            artifact: naucz-kube-windows
            binary: naucz-kube.exe
          - os: macos-latest
            label: macOS
            artifact: naucz-kube-macos
            binary: naucz-kube
          - os: ubuntu-latest
            label: Linux
            artifact: naucz-kube-linux
            binary: naucz-kube

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Build frontendu trafia do backend/static — spec pakuje ten katalog.
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Zależności backendu
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: PyInstaller
        working-directory: backend
        run: pyinstaller naucz-kube.spec --noconfirm

      # Szybki test dymny: binarka wstaje i odpowiada na /api/health.
      - name: Test uruchomieniowy (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: backend/dist
        env:
          NAUCZ_KUBE_NO_BROWSER: '1'
        run: |
          ./naucz-kube &
          pid=$!
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/api/health > /dev/null && ok=1 && break
            sleep 1
          done
          kill $pid || true
          test "$ok" = "1" || (echo "Binarka nie odpowiedziała na /api/health" && exit 1)

      - name: Test uruchomieniowy (Windows)
        if: runner.os == 'Windows'
        working-directory: backend/dist
        env:
          NAUCZ_KUBE_NO_BROWSER: '1'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\naucz-kube.exe -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            try {
              Invoke-WebRequest -Uri http://127.0.0.1:8000/api/health -UseBasicParsing -TimeoutSec 2 | Out-Null
              $ok = $true; break
            } catch { Start-Sleep -Seconds 1 }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Binarka nie odpowiedziała na /api/health" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: backend/dist/${{ matrix.binary }}
          retention-days: 30
          if-no-files-found: error

      - name: Dołącz do Release'u
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: backend/dist/${{ matrix.binary }}
