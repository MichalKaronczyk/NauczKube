name: CI

# Testy jednostkowe backendu przy każdym pushu. Testy używające prawdziwego LLM
# (ewaluator, persona) uruchamiamy ręcznie — patrz docs/TESTY.md — żeby nie
# zużywać dziennych limitów darmowych planów.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend — pytest + ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Autotest katalogu błędów (SymPy)
        run: python -c "from app.math.verify import selfcheck_catalog; r=selfcheck_catalog(); bad=[x.as_dict() for x in r if not x.ok]; print(f'{len(r)} sprawdzeń, {len(bad)} niepoprawnych'); assert not bad, bad"

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend — typy + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: E2E — Playwright (pełna sesja K01)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Zależności
        run: |
          pip install -r backend/requirements.txt
          cd frontend && npm ci && npx playwright install --with-deps chromium

      - name: Build frontendu
        run: cd frontend && npm run build

      - name: Serwer
        run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health > /dev/null && break
            sleep 1
          done

      - name: Playwright
        run: cd frontend && npx playwright test --project=chromium e2e/session.spec.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: frontend/test-results/
          retention-days: 5
